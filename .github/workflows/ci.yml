name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  testes:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Baixar código
        uses: actions/checkout@v5
      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar dependências nativas
        run: sudo apt-get update && sudo apt-get install -y libopus0
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[testes]"
          python -m pip install build
      - name: Executar testes sem rede externa
        run: python -m pytest -q
      - name: Validar empacotamento
        run: python -m build
      - name: Validar importação e versão
        run: python -c "import pimcord; assert pimcord.__version__ == '0.6.9'; print(pimcord.__version__)"
